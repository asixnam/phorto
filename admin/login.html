<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>asixnam</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../public/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dark-mode">

  <div class="login-container">
    <div class="about-card" style="max-width: 400px; width: 100%; text-align: center;">
      <div class="section-tag">// SECURE_UPLINK_REQUIRED</div>
      <h1 class="service-title">ADMIN LOGIN</h1>
      <form id="loginForm" class="modal-form">
        <div class="form-group" style="position: relative;">
          <label>ACCESS_KEY</label>
          <input type="password" id="adminPassword" placeholder="Enter security key" required
            style="background: rgba(255,255,255,0.05); border: 1px solid var(--text-primary); text-align: center; letter-spacing: 5px; color: var(--text-secondary); width: 100%;">
          <i id="togglePassword" class="fas fa-eye"
            style="position: absolute; right: 15px; top: 35px; cursor: pointer; opacity: 0.5;"></i>
        </div>
        <button type="submit" class="service-cta" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">
          <i class="fas fa-unlock"></i> AUTHORIZE
        </button>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nmlxivljaduwpttsxgoe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tbHhpdmxqYWR1d3B0dHN4Z29lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODAxNjQsImV4cCI6MjA5Mjg1NjE2NH0.ApzztRY7eKPV0Ivo5aOv_0vjgxAG2gDM3HhuFSle4SI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // If already logged in, redirect to dashboard
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
      }
    }
    checkSession();

    // Login Logic
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTHENTICATING...';

      const email = "admin@asixnam.com";
      const passwordInput = document.getElementById('adminPassword');

      try {
        const passwordValue = passwordInput.value.trim();
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: passwordValue,
        });

        if (error) throw error;
        window.location.href = 'dashboard.html';
      } catch (error) {
        let msg = error.message;
        if (msg === "Invalid login credentials") {
          msg = "Password Salah. Silakan cek kembali.";
        }
        alert('LOGIN GAGAL: ' + msg);
        submitBtn.innerHTML = '<i class="fas fa-unlock"></i> AUTHORIZE';
      }
    });

    // Toggle Password
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordInput = document.getElementById('adminPassword');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // Theme initialization
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.remove('dark-mode');
    }
  </script>
</body>
</html>
