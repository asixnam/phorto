<div id="loginSection" class="login-container">
  <div class="about-card" style="max-width: 400px; width: 100%; text-align: center;">
    <div class="section-tag">// SECURE_UPLINK_REQUIRED</div>
    <h1 class="service-title">ADMIN LOGIN</h1>
    <form id="loginForm" class="modal-form">
      <div class="form-group" style="position: relative;">
        <label>ACCESS_KEY</label>
        <input type="password" id="adminPassword" placeholder="Enter security key" required
          style="background: rgba(255,255,255,0.05); border: 1px solid var(--text-primary); text-align: center; letter-spacing: 5px; color: var(--text-secondary); width: 100%;">
        <i id="togglePassword" class="fas fa-eye"
          style="position: absolute; right: 15px; top: 35px; cursor: pointer; opacity: 0.5;"></i>
      </div>
      <button type="submit" class="service-cta" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">
        <i class="fas fa-unlock"></i> AUTHORIZE
      </button>
    </form>
  </div>
</div>
