<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>adminasix</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="../public/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="dark-mode">

  <div id="header-container"></div>
  <div id="login-container"></div>
  <div id="dashboard-container"></div>

  <script>
    const SUPABASE_URL = 'https://nmlxivljaduwpttsxgoe.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tbHhpdmxqYWR1d3B0dHN4Z29lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODAxNjQsImV4cCI6MjA5Mjg1NjE2NH0.ApzztRY7eKPV0Ivo5aOv_0vjgxAG2gDM3HhuFSle4SI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let loginSection, adminDashboard, ordersTableBody;

    async function loadAdminComponents() {
      try {
        // Fetch components concurrently
        const [headerRes, loginRes, dashboardRes] = await Promise.all([
          fetch('header.html'),
          fetch('login.html'),
          fetch('dashboard.html')
        ]);

        document.getElementById('header-container').innerHTML = await headerRes.text();
        document.getElementById('login-container').innerHTML = await loginRes.text();
        document.getElementById('dashboard-container').innerHTML = await dashboardRes.text();

        // Initialize DOM elements after HTML is injected
        loginSection = document.getElementById('loginSection');
        adminDashboard = document.getElementById('adminDashboard');
        ordersTableBody = document.getElementById('ordersTableBody');

        initAdminEvents();
        checkSession();
      } catch (error) {
        console.error('Error loading admin components:', error);
        document.body.innerHTML = '<h2 style="color:red; text-align:center; padding: 50px;">Gagal memuat komponen Admin. Pastikan Anda menjalankannya di Local Server.</h2>';
      }
    }

    function initAdminEvents() {
      // Login logic with Supabase Auth
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AUTHENTICATING...';

        const email = "admin@asixnam.com";
        const passwordInput = document.getElementById('adminPassword');

        if (!passwordInput) {
          alert('Error: Elemen password tidak ditemukan!');
          return;
        }

        try {
          const passwordValue = passwordInput.value.trim();
          console.log("Attempting login for:", email);

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: passwordValue,
          });

          if (error) throw error;
          showDashboard();
        } catch (error) {
          let msg = error.message;
          if (msg === "Invalid login credentials") {
            msg = "Email atau Password Salah. Silakan cek kembali atau matikan 'Confirm Email' di settings Supabase.";
          }
          alert('LOGIN GAGAL: ' + msg);
          submitBtn.innerHTML = '<i class="fas fa-unlock"></i> AUTHORIZE';
        }
      });

      // Toggle Password Visibility
      document.getElementById('togglePassword').addEventListener('click', function () {
        const passwordInput = document.getElementById('adminPassword');
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });

      // Theme Toggle Logic
      const themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        const icon = themeToggle.querySelector('i');

        function setTheme(theme) {
          if (theme === 'dark') {
            document.body.classList.add('dark-mode');
            icon.classList.replace('fa-sun', 'fa-moon');
          } else {
            document.body.classList.remove('dark-mode');
            icon.classList.replace('fa-moon', 'fa-sun');
          }
          localStorage.setItem('theme', theme);
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
          const isDark = document.body.classList.contains('dark-mode');
          setTheme(isDark ? 'light' : 'dark');
        });
      }
    }

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showDashboard();
      }
    }

    function showDashboard() {
      loginSection.style.display = 'none';
      adminDashboard.style.display = 'block';
      document.getElementById('refreshBtn').style.display = 'flex';
      document.getElementById('logoutBtn').style.display = 'flex';
      fetchOrders();
    }

    window.handleLogout = async () => {
      await supabaseClient.auth.signOut();
      location.reload();
    };

    async function fetchOrders() {
      ordersTableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">ACCESSING_DATABASE...</td></tr>';

      try {
        const { data, error } = await supabaseClient
          .from('orders')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (data.length === 0) {
          ordersTableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 40px;">NO_DATA_FOUND</td></tr>';
          updateStats(0, 0, 0, 0);
          return;
        }

        let unpaid = 0, paid = 0, completed = 0;
        const total = data.length;

        ordersTableBody.innerHTML = '';
        data.forEach(order => {
          if (order.payment_status === 'unpaid') unpaid++;
          if (order.payment_status === 'paid') paid++;
          if (order.status === 'completed') completed++;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td data-label="Tanggal">${new Date(order.created_at).toLocaleDateString()}</td>
            <td data-label="Layanan" style="color: var(--text-primary)">${order.order_type}</td>
            <td data-label="Klien">${order.client_name}<br><small style="opacity:0.5">${order.client_email}</small></td>
            <td data-label="WhatsApp"><a href="https://wa.me/${order.client_whatsapp}" target="_blank" style="color: #25D366; text-decoration:none">
              <i class="fab fa-whatsapp"></i> ${order.client_whatsapp}
            </a></td>
            <td data-label="Catatan" style="font-size: 0.8rem; max-width: 200px; white-space: normal;">${order.order_notes || '-'}</td>
            <td data-label="Status">
              <select onchange="updateOrderStatus('${order.id}', this.value)" class="status-select ${order.status}">
                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="in-progress" ${order.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Completed</option>
              </select>
            </td>
            <td data-label="Pembayaran">
              <select onchange="updatePaymentStatus('${order.id}', this.value)" class="status-badge ${order.payment_status}" style="border:none; cursor:pointer;">
                <option value="unpaid" ${order.payment_status === 'unpaid' ? 'selected' : ''}>Unpaid</option>
                <option value="paid" ${order.payment_status === 'paid' ? 'selected' : ''}>Paid</option>
              </select>
            </td>
            <td data-label="Aksi">
              <button onclick="deleteOrder('${order.id}')" class="btn-delete" style="opacity:0.5"><i class="fas fa-trash"></i></button>
            </td>
          `;
          ordersTableBody.appendChild(tr);
        });

        updateStats(total, unpaid, paid, completed);

      } catch (err) {
        ordersTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: red;">ERROR: ${err.message}</td></tr>`;
      }
    }

    function updateStats(total, unpaid, paid, completed) {
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statUnpaid').textContent = unpaid;
      document.getElementById('statPaid').textContent = paid;
      document.getElementById('statCompleted').textContent = completed;
    }

    window.updateOrderStatus = async (id, status) => {
      const { error } = await supabaseClient.from('orders').update({ status }).eq('id', id);
      if (error) alert(error.message);
      else fetchOrders();
    };

    window.updatePaymentStatus = async (id, payment_status) => {
      const { error } = await supabaseClient.from('orders').update({ payment_status }).eq('id', id);
      if (error) alert(error.message);
      else fetchOrders();
    };

    window.deleteOrder = async (id) => {
      if (!confirm('DELETE_ORDER_PERMANENTLY?')) return;
      const { error } = await supabaseClient.from('orders').delete().eq('id', id);
      if (error) alert(error.message);
      else fetchOrders();
    };

    // Load everything when the DOM is ready
    document.addEventListener('DOMContentLoaded', loadAdminComponents);
  </script>
</body>

</html>
