<header class="cyber-header">
  <div class="container navbar">
    <!-- Left: Logo & Title -->
    <div class="nav-profile">
      <div class="profile-avatar">
        <img src="../public/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <div class="profile-info">
        <div class="profile-name">ADMIN<br>ASIX</div>
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="nav-right-cyber">
      <div class="cyber-actions" style="border-left: none; padding-left: 0;">
        <button id="refreshBtn" onclick="fetchOrders()" class="cyber-btn-mini" style="display: none;" title="Refresh Data">
          <i class="fas fa-sync"></i>
        </button>
        <button id="themeToggle" class="cyber-btn-mini" title="Toggle Theme">
          <i class="fas fa-moon"></i>
        </button>
        <button id="logoutBtn" onclick="handleLogout()" class="cyber-btn-mini" style="display: none; color: #ff4d4d;" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </div>
</header>
